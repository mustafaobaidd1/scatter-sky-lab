<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Scatter — why the sky is blue</title>
    <meta
      name="description"
      content="A spectral sky simulator: drag the sun, change the physics, and see why skies are blue, sunsets red and Martian sunsets blue."

    <meta name="theme-color" content="#101418" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Scatter — why the sky is blue" />

      property="og:description"
      content="A spectral sky simulator: drag the sun, change the physics, and see why skies are blue, sunsets red and Martian sunsets blue."

    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Pre-paint: a quiet sky so there is never a blank flash before the renderer starts. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101418;
      }
      #app {
        position: fixed;
        inset: 0;
        background: linear-gradient(
          180deg,
          #5b6b7c 0%,
          #8d98a0 46%,
          #d8d2c0 76%,
          #1a1c16 80%,
          #070806 100%
        );
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="position: fixed; inset: auto 16px 16px; color: #f6f4ef; font: 16px/1.5 system-ui">
        Scatter renders the sky with JavaScript and WebGL. Please enable JavaScript to use it.
      </p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
